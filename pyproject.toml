[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "my-cli-tool"
dynamic = ["version"]
description = "A small, extensible command line tool."
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
my-cli-tool = "my_cli_tool.cli:main"

[tool.setuptools.dynamic]
version = { attr = "my_cli_tool.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
my_cli_tool = ["py.typed"]
